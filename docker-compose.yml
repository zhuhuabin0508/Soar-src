# ===== SOAR 平台：后端栈运行环境（源码挂载）=====
# 启动：bash dev.sh up
# 或：  docker compose --env-file .env.dev up -d
# 停止：bash dev.sh down   （切勿 down -v，会清空数据卷）
#
# 前端不在本编排内：本地开发在宿主机 npm run dev，生产由 Nginx 托管 frontend/dist
# 后端：挂载 ./backend/app，uvicorn 直跑（承载生产流量禁用 --reload：
#       reloader 文件监听存在竞态卡死风险，导致 API 无响应且容器仍显示 Up；
#       修改后端代码后需 docker restart soar-backend-dev 或执行 deploy/deploy.sh）
# Worker 改 Celery 后需：docker restart soar-worker-dev
services:
  postgres:
    image: postgres:15
    container_name: soar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-soar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [soar-net]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: soar-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-12345678}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-12345678}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [soar-net]
    restart: unless-stopped

  backend-dev:
    image: soar-backend:latest
    container_name: soar-backend-dev
    working_dir: /app
    entrypoint: []
    command:
      - sh
      - -c
      - |
        echo "==> [dev] ensuring DB tables..."
        python -c "from app.database import engine, Base; from app.models import Workflow, Execution, ExecutionTrace; Base.metadata.create_all(bind=engine); print('DB tables ensured (dev)')"
        python -c "from app.core.seed import ensure_seed_data; ensure_seed_data()" || echo "==> [dev] seed skipped"
        echo "==> [dev] starting uvicorn on 0.0.0.0:8000"
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend/app:/app/app
      - ./backend/entrypoint.sh:/app/entrypoint.sh:ro
      - ./backend/requirements.txt:/app/requirements.txt:ro
      - uploads:/app/uploads
      - backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PATH: /usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-soar}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-soar}
      REDIS_URL: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/1
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      # 本地开发调试：OTP 验证码明文回显。生产请勿设置或设为 false。
      ENABLE_DEV_CODE: ${ENABLE_DEV_CODE:-false}
      WORKFLOW_SOC_AGENT_ID: ${WORKFLOW_SOC_AGENT_ID:-0}
      WORKFLOW_SYSTEM_USER_ID: ${WORKFLOW_SYSTEM_USER_ID:-0}
      BAN_ANALYST_AGENT_ID: ${BAN_ANALYST_AGENT_ID:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
      # 把容器内 514 UDP 发布到宿主机，供上游设备(青藤/防火墙)推送 syslog
      - "514:514/udp"
    networks: [soar-net]
    restart: unless-stopped
    # 健康检查：容器内自检 /api/v1/version（无认证接口）。
    # 卡死场景（进程在但不响应）下约 90 秒标记 unhealthy，供监控告警；
    # 崩溃退出由 restart: unless-stopped 自动拉起。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/version', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 5g
    memswap_limit: 5g

  worker-dev:
    image: soar-backend:latest
    container_name: soar-worker-dev
    working_dir: /app
    entrypoint: []
    command: ["celery", "-A", "app.core.celery_app", "worker", "-l", "info"]
    volumes:
      - ./backend/app:/app/app
    environment:
      PATH: /usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-soar}
      REDIS_URL: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/1
      TZ: Asia/Shanghai
      WORKFLOW_SOC_AGENT_ID: ${WORKFLOW_SOC_AGENT_ID:-0}
      WORKFLOW_SYSTEM_USER_ID: ${WORKFLOW_SYSTEM_USER_ID:-0}
      BAN_ANALYST_AGENT_ID: ${BAN_ANALYST_AGENT_ID:-0}
    depends_on:
      redis:
        condition: service_healthy
      backend-dev:
        condition: service_started
    networks: [soar-net]
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g

  beat-dev:
    image: soar-backend:latest
    container_name: soar-beat-dev
    working_dir: /app
    entrypoint: []
    command: ["celery", "-A", "app.core.celery_app", "beat", "-l", "info"]
    volumes:
      - ./backend/app:/app/app
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-soar}
      REDIS_URL: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/1
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      backend-dev:
        condition: service_started
    networks: [soar-net]
    restart: unless-stopped

networks:
  # 固定网络名（历史沿用 config_default；security-tools 旁路栈已移除）。
  # 若不存在，dev.sh up 会先创建；已存在则直接加入（服务器上沿用原网络，数据卷不受影响）。
  soar-net:
    name: config_default

volumes:
  pgdata:
    name: soaragent_pgdata
  uploads:
    name: soaragent_uploads
  backups:
    name: soaragent_backups
  # frontend node_modules 匿名卷（隔离 Windows/容器两种平台的依赖）
  frontend_node_modules:
